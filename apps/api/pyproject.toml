[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reseller-agent-api"
version = "0.1.0"
description = "FastAPI backend for Reseller AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.30.0",
    "instructor>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "beautifulsoup4>=4.12.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
